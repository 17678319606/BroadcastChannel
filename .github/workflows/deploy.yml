name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm (pin a known-good version via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Astro → Cloudflare Workers bundle)
        run: pnpm build
        env:
          SERVER_ADAPTER: cloudflare_workers

      # Each worker has its OWN config file with a hardcoded (non-secret)
      # FEED_CACHE KV namespace id. We deploy with an explicit --config so
      # wrangler uses exactly the intended file (correct name + KV id) — no
      # auto-discovery ambiguity, no runtime sed.
      #
      # `main` is an EXPLICIT relative file path (not a bare module specifier)
      # because wrangler 4.x, when --config is passed, otherwise fails to
      # resolve a bare specifier like "@astrojs/cloudflare/entrypoints/server"
      # under pnpm's symlinked node_modules. The explicit path points at the
      # same adapter entrypoint and bundles identically.
      - name: Deploy worker (123yunpan)
        run: |
          pnpm exec wrangler deploy --config "$(pwd)/wrangler.jsonc"

      - name: Deploy worker (zhongnianren)
        run: |
          pnpm exec wrangler deploy --config "$(pwd)/wrangler.zn.jsonc"
