name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@11.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Astro → Cloudflare Workers bundle)
        run: pnpm build
        env:
          SERVER_ADAPTER: cloudflare_workers

      # Idempotently ensure one FEED_CACHE KV namespace PER worker so the two
      # different channel sets never share/cross-contaminate a cache key.
      - name: Ensure FEED_CACHE KV namespaces (one per worker)
        id: kv
        run: |
          set -e
          ensure() {
            local title="$1"
            local id
            id=$(pnpm exec wrangler kv namespace list --json \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((x['id'] for x in d if x.get('title')=='$title'),''))")
            if [ -z "$id" ]; then
              id=$(pnpm exec wrangler kv namespace create "$title" \
                | grep -oE 'id = "[a-f0-9]+"' | head -1 | sed 's/id = "//; s/"//')
            fi
            echo "$id"
          }
          echo "FEED_123=$(ensure bc-feed-123yunpan)" >> "$GITHUB_OUTPUT"
          echo "FEED_ZN=$(ensure bc-feed-zhongnianren)" >> "$GITHUB_OUTPUT"
          echo "FEED_123=$(ensure bc-feed-123yunpan)"
          echo "FEED_ZN=$(ensure bc-feed-zhongnianren)"

      - name: Deploy worker (123yunpan)
        run: |
          python3 - <<'PY'
          import os, re
          p = 'wrangler.jsonc'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'("binding":\s*"FEED_CACHE",\s*"id":\s*")[^"]*(")',
                     r'\g<1>' + os.environ['FEED_123'] + r'\g<2>', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('wrangler.jsonc patched with 123yunpan FEED_CACHE id')
          PY
          pnpm exec wrangler deploy

      - name: Deploy worker (zhongnianren)
        run: |
          python3 - <<'PY'
          import os, re
          p = 'wrangler.jsonc'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'("binding":\s*"FEED_CACHE",\s*"id":\s*")[^"]*(")',
                     r'\g<1>' + os.environ['FEED_ZN'] + r'\g<2>', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('wrangler.jsonc patched with zhongnianren FEED_CACHE id')
          PY
          pnpm exec wrangler deploy --name zhongnianren
