name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm (pin a known-good version via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Astro → Cloudflare Workers bundle)
        run: pnpm build
        env:
          SERVER_ADAPTER: cloudflare_workers

      # IMPORTANT: wrangler 4.x fails to resolve a bare-specifier `main`
      # (e.g. "@astrojs/cloudflare/entrypoints/server") when --config is
      # passed — it then treats it as a relative file path and cannot find it
      # under pnpm's symlinked node_modules. Auto-discovery (no --config)
      # resolves it correctly via Node module resolution, so we deploy by
      # auto-discovering the default wrangler.jsonc. For the second worker we
      # swap in wrangler.zn.jsonc as the default config before deploying.
      # No sed, no runtime KV resolution — the ids are committed directly.
      - name: Deploy worker (123yunpan)
        run: |
          pnpm exec wrangler deploy

      - name: Deploy worker (zhongnianren)
        run: |
          cp wrangler.zn.jsonc wrangler.jsonc
          pnpm exec wrangler deploy
