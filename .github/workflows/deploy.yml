name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@11.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Astro → Cloudflare Workers bundle)
        run: pnpm build
        env:
          SERVER_ADAPTER: cloudflare_workers

      - name: Ensure FEED_CACHE KV namespace exists
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          list_json=$(pnpm exec wrangler kv namespace list --json)
          id=$(echo "$list_json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((x.get('id') for x in d if x.get('title')=='FEED_CACHE' or x.get('name')=='FEED_CACHE'), ''))")
          if [ -z "$id" ]; then
            out=$(pnpm exec wrangler kv namespace create FEED_CACHE 2>&1) || true
            if ! echo "$out" | grep -q 'id = "'; then
              list_json2=$(pnpm exec wrangler kv namespace list --json)
              id=$(echo "$list_json2" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((x.get('id') for x in d if x.get('title')=='FEED_CACHE' or x.get('name')=='FEED_CACHE'), ''))")
            else
              id=$(echo "$out" | grep -oE 'id = "[a-f0-9]+"' | head -1 | sed 's/id = "//; s/"//')
            fi
          fi
          echo "FEED_CACHE_ID=$id" >> "$GITHUB_OUTPUT"
          echo "Using FEED_CACHE id: $id"

      - name: Inject KV namespace id into wrangler.jsonc
        env:
          FEED_CACHE_ID: ${{ steps.kv.outputs.FEED_CACHE_ID }}
        run: |
          python3 - <<'PY'
          import os, re
          p = 'wrangler.jsonc'
          s = open(p, encoding='utf-8').read()
          s = s.replace('PASTE_FEED_CACHE_ID_HERE', os.environ['FEED_CACHE_ID'])
          open(p, 'w', encoding='utf-8').write(s)
          print('wrangler.jsonc patched with KV id')
          PY

      - name: Push GH_DISPATCH_TOKEN to Cloudflare secret
        if: ${{ secrets.GH_DISPATCH_TOKEN != '' }}
        run: echo "${{ secrets.GH_DISPATCH_TOKEN }}" | pnpm exec wrangler secret put GH_DISPATCH_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker (123yunpan)
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker (zhongnianren)
        run: pnpm exec wrangler deploy --name zhongnianren
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
