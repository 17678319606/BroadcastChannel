name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm (pin a known-good version via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build + deploy each worker as a self-contained unit.
      #
      # IMPORTANT constraints discovered the hard way:
      # 1. `main` MUST stay the bare specifier "@astrojs/cloudflare/entrypoints/server".
      #    Pointing it at the adapter file directly breaks Astro's virtual modules
      #    (virtual:astro-cloudflare:config, etc.). Auto-discovery (no --config)
      #    resolves that bare specifier via Node module resolution, which works
      #    under pnpm's symlinked node_modules. Passing --config makes wrangler
      #    treat the bare specifier as a relative file path and fail.
      # 2. The @astrojs/cloudflare adapter BAKEs the worker name from wrangler.jsonc
      #    at BUILD time, so we must `cp` the per-worker config into wrangler.jsonc
      #    and BUILD before deploying each worker. Otherwise the 2nd deploy reuses
      #    the 1st build's baked name.
      # 3. Each worker's FEED_CACHE KV id is hardcoded in its own config file — no
      #    sed, no runtime KV resolution.
      - name: Deploy worker (123yunpan)
        run: |
          pnpm build
          pnpm exec wrangler deploy --name 123yunpan
        env:
          SERVER_ADAPTER: cloudflare_workers

      - name: Deploy worker (zhongnianren)
        run: |
          cp wrangler.zn.jsonc wrangler.jsonc
          pnpm build
          pnpm exec wrangler deploy --name zhongnianren
        env:
          SERVER_ADAPTER: cloudflare_workers
