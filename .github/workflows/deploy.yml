name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm (pin a known-good version via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Astro → Cloudflare Workers bundle)
        run: pnpm build
        env:
          SERVER_ADAPTER: cloudflare_workers

      # Idempotently resolve ONE FEED_CACHE KV namespace PER worker via the
      # Cloudflare REST API (avoids wrangler CLI JSON-flag quirks). The two
      # workers aggregate different channel sets, so they must NOT share a
      # single cache key space — hence separate namespaces.
      - name: Resolve FEED_CACHE KV namespaces (one per worker)
        id: kv
        run: |
          list_ns() {
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((x['id'] for x in d.get('result',[]) if x.get('title')=='$1'),''))"
          }
          create_ns() {
            curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d "{\"title\":\"$1\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',{}).get('id',''))"
          }
          ensure() {
            local id; id=$(list_ns "$1")
            if [ -z "$id" ]; then id=$(create_ns "$1"); fi
            echo "$id"
          }
          F123=$(ensure bc-feed-123yunpan)
          FZN=$(ensure bc-feed-zhongnianren)
          {
            echo "FEED_123=$F123"
            echo "FEED_ZN=$FZN"
          } >> "$GITHUB_ENV"
          echo "FEED_123=$F123"
          echo "FEED_ZN=$FZN"

      - name: Deploy worker (123yunpan)
        run: |
          echo "FEED_123=$FEED_123"
          sed -i "s/PASTE_FEED_CACHE_ID_HERE/$FEED_123/g" wrangler.jsonc
          echo "--- wrangler.jsonc after patch (FEED_CACHE line) ---"
          grep -n "FEED_CACHE" wrangler.jsonc
          grep -q "$FEED_123" wrangler.jsonc || { echo "PATCH FAILED"; exit 1; }
          pnpm exec wrangler deploy

      - name: Deploy worker (zhongnianren)
        run: |
          git checkout -- wrangler.jsonc || true
          echo "FEED_ZN=$FEED_ZN"
          sed -i "s/PASTE_FEED_CACHE_ID_HERE/$FEED_ZN/g" wrangler.jsonc
          echo "--- wrangler.jsonc after patch (FEED_CACHE line) ---"
          grep -n "FEED_CACHE" wrangler.jsonc
          grep -q "$FEED_ZN" wrangler.jsonc || { echo "PATCH FAILED"; exit 1; }
          pnpm exec wrangler deploy --name zhongnianren
