name: keepalive

on:
  schedule:
    - cron: '17 3 1,26 * *'   # monthly ~25 days (03:17 UTC ≈ 11:17 Beijing)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keepalive commit if idle > 45 days
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "audit-bot"
          git config user.email "bot@users.noreply.github.com"
          last=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          now=$(date +%s)
          age=$(( (now - ${last}) / 86400 ))
          echo "days since last commit: ${age}"
          if [ "$age" -gt 45 ]; then
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) keepalive" >> .keepalive
            git add -A
            git commit -m "keepalive: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
            git push
            echo "keepalive commit created"
          else
            echo "recent activity, skip"
          fi
